<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <defs>
    <linearGradient id="truckCab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="50%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="chromeGrill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0e0e0"/>
      <stop offset="70%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#eeeeee"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(130, 10)">
    <!-- J Letter -->
    <path d="M 45 0 L 75 0 L 75 95 C 75 125, 45 135, 10 135 C -15 135, -30 120, -30 100 L 0 100 C 0 108, 8 112, 16 112 C 32 112, 45 106, 45 88 Z" fill="#1e232a"/>

    <!-- Semi Truck Illustration Overlaid on J and junction -->
    <g transform="translate(-15, 55) scale(0.65)" filter="url(#shadow)">
      <!-- Exhaust Stack -->
      <rect x="22" y="-25" width="5" height="40" fill="#9e9e9e" rx="1"/>
      <path d="M 22 -25 C 22 -32, 16 -35, 10 -35 L 10 -31 C 14 -31, 18 -29, 18 -25 Z" fill="#757575"/>
      
      <!-- Truck Sleeper/Cab Body -->
      <path d="M 20 5 L 68 5 L 75 22 L 75 75 L 12 75 L 12 25 L 20 20 Z" fill="url(#truckCab)"/>
      <!-- Windshield -->
      <polygon points="25,12 64,12 68,26 25,26" fill="#e0f7fa" stroke="#37474f" stroke-width="2"/>
      <line x1="45" y1="12" x2="45" y2="26" stroke="#37474f" stroke-width="2"/>
      <!-- Sun Visor -->
      <polygon points="20,10 70,10 74,14 18,14" fill="#ffffff"/>
      <!-- Hood / Front Grille -->
      <path d="M 30 30 L 74 30 L 75 75 L 30 75 Z" fill="#d32f2f"/>
      <rect x="36" y="34" width="34" height="38" rx="3" fill="url(#chromeGrill)" stroke="#424242" stroke-width="1.5"/>
      <!-- Grille Slats -->
      <line x1="42" y1="38" x2="42" y2="68" stroke="#424242" stroke-width="1.5"/>
      <line x1="48" y1="38" x2="48" y2="68" stroke="#424242" stroke-width="1.5"/>
      <line x1="53" y1="38" x2="53" y2="68" stroke="#424242" stroke-width="1.5"/>
      <line x1="58" y1="38" x2="58" y2="68" stroke="#424242" stroke-width="1.5"/>
      <line x1="64" y1="38" x2="64" y2="68" stroke="#424242" stroke-width="1.5"/>
      <!-- Bumper -->
      <rect x="24" y="73" width="56" height="8" rx="2" fill="#eeeeee" stroke="#616161" stroke-width="1.5"/>
      <!-- Headlights -->
      <circle cx="28" cy="62" r="4.5" fill="#fff9c4" stroke="#424242" stroke-width="1.5"/>
      <circle cx="74" cy="62" r="4.5" fill="#fff9c4" stroke="#424242" stroke-width="1.5"/>
      <!-- Wheel -->
      <circle cx="24" cy="81" r="10" fill="#212121"/>
      <circle cx="24" cy="81" r="5" fill="#bdbdbd"/>
    </g>

    <!-- B Letter in Golden Yellow -->
    <path d="M 80 0 L 132 0 C 158 0, 172 14, 172 34 C 172 48, 162 58, 148 64 C 166 70, 176 82, 176 101 C 176 124, 158 135, 130 135 L 80 135 Z M 108 24 L 108 52 L 128 52 C 138 52, 144 46, 144 38 C 144 30, 138 24, 128 24 Z M 108 76 L 108 111 L 130 111 C 142 111, 148 103, 148 93 C 148 83, 141 76, 129 76 Z" fill="url(#goldB)"/>

    <!-- 'A N D' vertically on the separator -->
    <g font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" fill="#1e232a" text-anchor="middle">
      <text x="77" y="102" transform="rotate(30, 77, 102)">A</text>
      <text x="88" y="118" transform="rotate(30, 88, 118)">N</text>
      <text x="99" y="134" transform="rotate(30, 99, 134)">D</text>
    </g>
  </g>

  <!-- Typography: EXPEDITE LOGISTICS -->
  <text x="250" y="195" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="7">
    <tspan fill="#111827">EXPEDITE</tspan>
    <tspan dx="15" fill="#f5b301">LOGISTICS</tspan>
  </text>
</svg>
